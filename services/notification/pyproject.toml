[project]
name = "biocad-notification"
version = "0.1.0"
description = "RabbitMQ inbox, durable delivery deduplication and demo Mailpit SMTP"
requires-python = ">=3.12,<3.13"
dependencies = ["aio-pika>=9.5,<10", "pydantic-settings>=2.6,<3", "jinja2>=3.1.6,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<0.25", "allure-pytest>=2.13,<3", "ruff>=0.8,<0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
