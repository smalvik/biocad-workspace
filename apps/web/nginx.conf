# In-container nginx for the web image: serves the React build and routes API paths
# to the backend services on the internal compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Docker's embedded DNS so restarted backends are re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $booking   http://booking:8000;
    set $assistant http://assistant:8001;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID      $request_id;

    location /api/v1/assistant/ {
        proxy_read_timeout 90s;
        proxy_pass $assistant;
    }

    location /api/ {
        proxy_pass $booking;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
