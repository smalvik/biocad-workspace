# Local / CI stack. Usage from repo root:
#   docker compose --env-file .env -f infra/compose.yaml up -d --build --wait
#   docker compose -f infra/compose.yaml --profile test run --rm booking-tests
# Local infrastructure only; release/deployment configuration belongs to WB-09.
name: biocad

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  TZ: UTC
  GIT_SHA: ${GIT_SHA:-dev}

x-test-env: &test-env
  <<: *backend-env
  RUN_TYPE: ${RUN_TYPE:-smoke}
  WORKING_TREE: ${WORKING_TREE:-unknown}
  RELEASE_VERSION: ${RELEASE_VERSION:-unreleased}
  REPORT_ENV: ${REPORT_ENV:-local}

x-build-args: &build-args
  GIT_SHA: ${GIT_SHA:-dev}

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biocad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biocad}
      POSTGRES_DB: ${POSTGRES_DB:-biocad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  booking:
    build: { context: .., dockerfile: services/booking/Dockerfile, target: runtime, args: *build-args }
    image: biocad-booking:${IMAGE_TAG:-local}
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-biocad}:${POSTGRES_PASSWORD:-biocad}@postgres:5432/${POSTGRES_DB:-biocad}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-workspace}
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${BOOKING_HOST_PORT:-8000}:8000"

  assistant:
    build: { context: ../services/assistant, target: runtime, args: *build-args }
    image: biocad-assistant:${IMAGE_TAG:-local}
    environment:
      <<: *backend-env
      BOOKING_BASE_URL: http://booking:8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
    ports:
      - "127.0.0.1:${ASSISTANT_HOST_PORT:-8001}:8001"

  web:
    build: { context: ../apps/web, target: runtime, args: *build-args }
    image: biocad-web:${IMAGE_TAG:-local}
    depends_on:
      booking: { condition: service_healthy }
      assistant: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"

  rabbitmq:
    # Digests pin the existing local infrastructure images; no floating latest tag.
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-biocad}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-biocad-local}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      # Diagnostics must use the server user, otherwise first-start probes can
      # create a root-owned Erlang cookie before the broker writes its own.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - maildata:/data
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- test profile: runs against the real stack above ----
  booking-tests:
    profiles: ["test"]
    build: { context: .., dockerfile: services/booking/Dockerfile, target: test }
    environment:
      <<: *test-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-biocad}:${POSTGRES_PASSWORD:-biocad}@postgres:5432/${POSTGRES_DB:-biocad}
      BOOKING_BASE_URL: http://booking:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-biocad}:${RABBITMQ_PASSWORD:-biocad-local}@rabbitmq:5672/
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_API_URL: http://mailpit:8025
      ALLOW_DATABASE_TESTS: ${ALLOW_DATABASE_TESTS:-0}
      SEED_DEMO_DATA: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-workspace}
    volumes:
      - ${ARTIFACTS_DIR:-../artifacts/local}/allure-results:/allure-results
    depends_on:
      booking: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  assistant-tests:
    profiles: ["test"]
    build: { context: ../services/assistant, target: test }
    environment:
      <<: *test-env
      BOOKING_BASE_URL: http://booking:8000
    volumes:
      - ${ARTIFACTS_DIR:-../artifacts/local}/allure-results:/allure-results

  web-tests:
    profiles: ["test"]
    build: { context: ../apps/web, target: test }

  e2e:
    profiles: ["test"]
    build: { context: ../tests/e2e }
    environment:
      <<: *test-env
      BASE_URL: http://web
      CI: ${CI:-}
    volumes:
      - ${ARTIFACTS_DIR:-../artifacts/local}/allure-results:/e2e/allure-results
      - ${ARTIFACTS_DIR:-../artifacts/local}/playwright-report:/e2e/playwright-report
      - ${ARTIFACTS_DIR:-../artifacts/local}/test-results:/e2e/test-results
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  rabbitdata:
  maildata:
