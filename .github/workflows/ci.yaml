name: Checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Branch and security baseline
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_policy.py
      - name: Unit, integration and browser checks
        env:
          RUN_TYPE: ${{ github.event_name == 'push' && 'regression' || 'smoke' }}
        run: python scripts/check.py --run-type "$RUN_TYPE"
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate readable Allure report
        if: always()
        run: npx --yes --package=allure-commandline@2.32.0 allure generate artifacts/*/allure-results --clean -o artifacts/allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Publish immutable candidates
    needs: check
    if: >-
      vars.REGISTRY_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build once per SHA and push digest candidates
        env:
          IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: python scripts/package_images.py --namespace "$IMAGE_NAMESPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: artifacts/candidate.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  delivery:
    name: Staging regression and production promotion
    needs: [check, package]
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    concurrency:
      group: biocad-shared-server-delivery
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: artifacts/
      - name: Pull candidate, run full isolated regression, update staging and smoke
        run: python scripts/remote_delivery.py stage --namespace "$IMAGE_NAMESPACE"
      - name: Promote the exact staging manifest to production and smoke HTTPS
        if: github.ref == 'refs/heads/main'
        run: python scripts/remote_delivery.py production --namespace "$IMAGE_NAMESPACE"
      - name: Retrieve real server evidence even on failure
        if: always()
        run: python scripts/remote_delivery.py report --namespace "$IMAGE_NAMESPACE"
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '17'
      - name: Render server Allure report
        if: always()
        run: python scripts/render_allure.py artifacts/server --output artifacts/allure-server
      - uses: docker/setup-buildx-action@v4
        if: success() && github.ref == 'refs/heads/main'
      - uses: docker/login-action@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish version and latest aliases without rebuilding
        if: success() && github.ref == 'refs/heads/main'
        run: python scripts/promote_images.py --namespace "$IMAGE_NAMESPACE"
      - name: Publish release and exact digest/evidence record
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: python scripts/publish_release.py --namespace "$IMAGE_NAMESPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
